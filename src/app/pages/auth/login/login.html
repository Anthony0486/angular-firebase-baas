<!-- src/app/auth/login/login.component.html -->
<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      <!-- Titre -->
      <div class="text-center mb-2">
        <h2 class="card-title text-2xl font-bold justify-center text-primary">Connexion CDA</h2>
        <p class="text-xs text-base-content/70 mt-1">Espace de gestion des tâches</p>
      </div>

      <!-- Erreur Firebase -->
      @if (errorMessage()) {
        <div class="alert alert-error text-sm p-3 rounded-lg shadow-sm">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Formulaire -->
      <form (ngSubmit)="onLogin()" class="space-y-4">
        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium">Adresse Email</span>
          </label>
          <input
            type="email"
            placeholder="etudiant@exemple.fr"
            class="input input-bordered w-full"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
          />
        </div>
        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium">Mot de passe</span>
          </label>
          <input
            type="password"
            placeholder="••••••••"
            class="input input-bordered w-full"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
          />
        </div>

        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading()">
            @if (isLoading()) {
              <span class="loading loading-spinner loading-sm"></span>
              Connexion...
            } @else {
              Se connecter
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
