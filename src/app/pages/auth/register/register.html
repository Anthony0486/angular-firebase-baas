<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      <!-- En-tête -->
      <div class="text-center mb-2">
        <h2 class="card-title text-2xl font-bold justify-center text-primary">Inscription</h2>
        <p class="text-xs text-base-content/70 mt-1">Créez votre compte</p>
      </div>

      <!-- Erreur -->
      @if (errorMessage()) {
        <div class="alert alert-error text-sm p-3 rounded-lg shadow-sm">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Formulaire -->
      <form (ngSubmit)="onRegister()" class="space-y-4">
        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium">Adresse Email</span>
          </label>
          <input
            type="email"
            placeholder="etudiant@exemple.fr"
            class="input input-bordered w-full"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
          />
        </div>

        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium">Mot de passe</span>
          </label>
          <input
            type="password"
            placeholder="••••••••"
            class="input input-bordered w-full"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
          />
        </div>

        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium">Confirmer le mot de passe</span>
          </label>
          <input
            type="password"
            placeholder="••••••••"
            class="input input-bordered w-full"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
            required
          />
        </div>

        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading()">
            @if (isLoading()) {
              <span class="loading loading-spinner loading-sm"></span>
              Création du compte...
            } @else {
              S'inscrire
            }
          </button>
        </div>
      </form>

      <!-- Lien vers le Login -->
      <div class="text-center mt-4">
        <span class="text-xs text-base-content/70">Déjà un compte ? </span>
        <a routerLink="/login" class="text-xs text-primary font-bold hover:underline"
          >Se connecter</a
        >
      </div>
    </div>
  </div>
</div>
